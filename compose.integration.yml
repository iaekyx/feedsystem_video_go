services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: integration-only
      MYSQL_DATABASE: integration
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pintegration-only --silent"]
      interval: 2s
      timeout: 3s
      retries: 40
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: integration
      RABBITMQ_DEFAULT_PASS: integration-only
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 40
  tests:
    image: golang:1.24.5
    working_dir: /src
    volumes:
      - ./backend:/src
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    environment:
      TEST_MYSQL_DSN: root:integration-only@tcp(mysql:3306)/integration?charset=utf8mb4&parseTime=True&loc=UTC
      TEST_AMQP_URL: amqp://integration:integration-only@rabbitmq:5672/
      TEST_REDIS_ADDR: redis:6379
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
    command: ["sh", "-c", "go test -race -p 1 -count=1 ./... && go vet ./..."]
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  go_mod:
    external: true
    name: feedsystem_go_mod
  go_build:
    external: true
    name: feedsystem_go_build
